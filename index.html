<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prace</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: black;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: Arial;
}

.text {
    font-size: 50px;
    font-weight: 900;
    z-index: 2;
    animation: rainbow 5s infinite linear, shake 3s infinite ease-in-out;
    text-transform: uppercase;
}

@keyframes rainbow {
    0% { color: red; }
    20% { color: orange; }
    40% { color: yellow; }
    60% { color: lime; }
    80% { color: cyan; }
    100% { color: violet; }
}

@keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(2px,-2px); }
    50% { transform: translate(-2px,2px); }
    75% { transform: translate(2px,2px); }
    100% { transform: translate(0,0); }
}

.button {
    margin-top: 30px;
    padding: 15px 30px;
    background: #5865F2;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    z-index: 2;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="text">W TRAKCIE PRAC TECHNICZNYCH</div>

<a class="button" href="https://discord.gg/YYRkZMxG" target="_blank">
DOŁĄCZ NA SERWER
</a>

<script>
console.log("JS STARTED");

// ===== CANVAS =====
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ===== LOAD IMAGES PROPERLY =====
function loadImage(src) {
    return new Promise(res => {
        const img = new Image();
        img.src = src;
        img.onload = () => res(img);
        img.onerror = () => console.log("Błąd ładowania:", src);
    });
}

let leaves = [];

async function init() {
    const imgs = await Promise.all([
        loadImage("leaves/1.png"),
        loadImage("leaves/2.png")
    ]);

    console.log("Images loaded");

    for (let i = 0; i < 60; i++) {
        leaves.push({
            x: Math.random() * canvas.width,
            y: Math.random() * -canvas.height,
            speed: 1 + Math.random() * 3,
            size: 20 + Math.random() * 40,
            img: imgs[Math.floor(Math.random() * imgs.length)],
            drift: (Math.random() - 0.5) * 2
        });
    }

    animate();
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    for (let l of leaves) {
        l.y += l.speed;
        l.x += l.drift;

        if (l.y > canvas.height + 50) {
            l.y = -50;
            l.x = Math.random() * canvas.width;
        }

        ctx.drawImage(l.img, l.x, l.y, l.size, l.size);
    }

    requestAnimationFrame(animate);
}

init();
</script>

</body>
</html>
