<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wkrótce</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .text {
        font-size: 80px;
        font-weight: 900;
        text-transform: uppercase;
        animation: shake 3s infinite ease-in-out, rainbow 5s infinite linear;
    }

    @keyframes shake {
        0% { transform: translate(0, 0); }
        25% { transform: translate(2px, -2px); }
        50% { transform: translate(-2px, 2px); }
        75% { transform: translate(2px, 2px); }
        100% { transform: translate(0, 0); }
    }

    @keyframes rainbow {
        0% { color: red; }
        20% { color: orange; }
        40% { color: yellow; }
        60% { color: lime; }
        80% { color: cyan; }
        100% { color: violet; }
    }

    .button {
        margin-top: 40px;
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        color: white;
        background: #5865F2;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        transition: 0.2s;
    }

    .button:hover {
        transform: scale(1.1);
        background: #4752c4;
    }

    .small {
        position: absolute;
        bottom: 20px;
        color: gray;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="text">WKRÓTCE</div>

<a class="button" href="https://discord.gg/YYRkZMxG" target="_blank">
    DOŁĄCZ NA SERWER
</a>

<div class="small">© 2026</div>

</body>
</html>
