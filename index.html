<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wkrótce</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: black;
        overflow: hidden;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
    }

    .text {
        font-size: 80px;
        font-weight: 900;
        z-index: 2;
        animation: shake 3s infinite ease-in-out, rainbow 5s infinite linear;
        text-transform: uppercase;
    }

    @keyframes shake {
        0% { transform: translate(0,0); }
        25% { transform: translate(2px,-2px); }
        50% { transform: translate(-2px,2px); }
        75% { transform: translate(2px,2px); }
        100% { transform: translate(0,0); }
    }

    @keyframes rainbow {
        0% { color: red; }
        20% { color: orange; }
        40% { color: yellow; }
        60% { color: lime; }
        80% { color: cyan; }
        100% { color: violet; }
    }

    .button {
        margin-top: 30px;
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        color: white;
        background: #5865F2;
        border-radius: 10px;
        text-decoration: none;
        z-index: 2;
        transition: 0.2s;
    }

    .button:hover {
        transform: scale(1.1);
        background: #4752c4;
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 0;
        pointer-events: none;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="text">WKRÓTCE</div>

<a class="button" href="https://discord.gg/YYRkZMxG" target="_blank">
    DOŁĄCZ NA SERWER
</a>

<audio id="music" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
// ===== MUZYKA =====
const music = document.getElementById("music");

function playMusic() {
    music.volume = 0.45;
    music.play().catch(() => {});
}

document.body.addEventListener("click", playMusic);
window.addEventListener("load", playMusic);

// ===== LIŚCIE =====
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const imagesSrc = ["leaves/1.png", "leaves/2.png"];
const images = [];

imagesSrc.forEach(src => {
    const img = new Image();
    img.src = src;
    images.push(img);
});

const leaves = [];

function createLeaf() {
    return {
        x: Math.random() * canvas.width,
        y: -50,
        speed: 1 + Math.random() * 3,
        size: 20 + Math.random() * 40,
        img: images[Math.floor(Math.random() * images.length)],
        drift: (Math.random() - 0.5) * 2
    };
}

// start
for (let i = 0; i < 50; i++) {
    leaves.push(createLeaf());
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < leaves.length; i++) {
        let l = leaves[i];

        l.y += l.speed;
        l.x += l.drift;

        if (l.y > canvas.height + 50) {
            leaves[i] = createLeaf();
            leaves[i].y = -50;
        }

        if (l.img.complete) {
            ctx.drawImage(l.img, l.x, l.y, l.size, l.size);
        }
    }

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
